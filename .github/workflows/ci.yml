name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check Lightbox API docs
        run: pnpm docs:api:check

      - name: Check Lightbox docs excerpts
        run: pnpm docs:excerpts:check

      - name: Check LLM docs
        run: pnpm docs:llms:check

      - name: Test
        run: pnpm test

      # The SBOM ships with the release, so a generator that has drifted out of
      # spec should fail here rather than at the moment of publishing.
      - name: Check the SBOM document
        run: pnpm sbom:check

  # `peerDependencies` claims react >= 18, so the oldest supported version has
  # to be exercised. It catches things React 19 hides: React 18 drops
  # `inert={true}`, its `useId()` values contain `:`, and @types/react 18 reads
  # `RefObject<T>` as nullable.
  react18:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Workspace-wide overrides rather than a package-level install: a single
      # copy of @types/react has to win, or nested React 19 types leak in and
      # the run fails on duplicate-type mismatches that no consumer would see.
      - name: Pin the workspace to React 18
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.pnpm = {
              ...pkg.pnpm,
              overrides: {
                ...pkg.pnpm?.overrides,
                react: '18.3.1',
                'react-dom': '18.3.1',
                '@types/react': '18.3.12',
                '@types/react-dom': '18.3.1',
              },
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          pnpm install --no-frozen-lockfile

      # From the package, not the repo root: pnpm installs react into the
      # workspace that depends on it and hoists nothing, so resolving from the
      # root finds no react at all and says so in a way that looks like the
      # override failed.
      - name: Verify React 18 is what got installed
        working-directory: packages/ramka
        run: |
          version=$(node -p "require('react').version")
          echo "react $version"
          case "$version" in
            18.*) ;;
            *) echo "expected React 18, got $version"; exit 1 ;;
          esac

      - name: Typecheck against @types/react 18
        run: pnpm --filter @ramka/react typecheck

      - name: Test
        run: pnpm --filter @ramka/react test

      - name: Build
        run: pnpm --filter @ramka/react build

  # Reports what a consumer's bundle would gain or lose from this PR. Runs
  # alongside `test` rather than after it: size feedback should not wait on the
  # suite.
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The base commit has to be in the clone to build the "before" side.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build head
        run: pnpm --filter @ramka/react build

      # Filtered by directory rather than by package name, because a base commit
      # from before a rename would match no project — and pnpm exits 0 on that,
      # so it would silently build nothing and look like a missing baseline.
      - name: Build base
        run: |
          git worktree add "$RUNNER_TEMP/base" '${{ github.event.pull_request.base.sha }}'
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm --filter "./packages/ramka" build

      # Head's copy of the script measures both sides, so editing the
      # measurement cannot masquerade as a change in size.
      - name: Measure
        id: report
        continue-on-error: true
        run: |
          node scripts/size-report.mjs \
            --head packages/ramka/dist/lightbox/lightbox.js \
            --base "$RUNNER_TEMP/base/packages/ramka/dist/lightbox/lightbox.js" \
            --markdown "$RUNNER_TEMP/size.md" \
            --json "$RUNNER_TEMP/size.json"

      - name: Publish to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/size.md" ]; then
            cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The size report did not run; see the Measure step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fork PRs get a read-only token, so for those the job summary above is
      # the whole report. Posting from a trusted context instead would mean
      # `pull_request_target`, which is not worth the secret-exfiltration risk
      # for a size comment.
      - name: Comment
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/size.md`;
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- ramka-size -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // One comment, edited in place, rather than one per push.
            const existing = comments.find((c) => (c.body ?? '').startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Size itself is reported without judgement for now. The export shape is
      # different: it is a structural regression that costs esbuild consumers
      # every unused part, and the byte totals cannot show it.
      - name: Fail on a structural regression
        if: steps.report.outcome == 'failure'
        run: |
          echo 'The size report failed — most likely the export-shape guard. See the comment on the PR.'
          exit 1

  preview:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @ramka/react build

      - name: Publish preview
        run: >
          pnpm exec pkg-pr-new publish './packages/ramka'
          --pnpm
          --comment=update
          --packageManager=pnpm
